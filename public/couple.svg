<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9cf" />
      <stop offset="1" stop-color="#ffb3c6" />
    </linearGradient>
  </defs>
  <rect width="900" height="900" fill="url(#bg)" />

  <!-- scattered dots so every tile looks different when scrambled -->
  <g fill="#fff" opacity="0.55">
    <circle cx="90" cy="110" r="26" /><circle cx="780" cy="90" r="18" />
    <circle cx="150" cy="420" r="14" /><circle cx="820" cy="470" r="30" />
    <circle cx="70" cy="780" r="22" /><circle cx="430" cy="840" r="16" />
    <circle cx="760" cy="800" r="24" /><circle cx="450" cy="70" r="12" />
  </g>

  <!-- face one -->
  <g transform="translate(130 250)">
    <circle cx="150" cy="190" r="150" fill="#ffe0bd" stroke="#6b3f2a" stroke-width="10" />
    <path d="M10 170 Q150 -40 290 170 Q250 40 150 40 Q50 40 10 170Z" fill="#6b3f2a" />
    <circle cx="105" cy="200" r="14" fill="#3a2418" /><circle cx="195" cy="200" r="14" fill="#3a2418" />
    <path d="M100 255 Q150 300 200 255" fill="none" stroke="#3a2418" stroke-width="10" stroke-linecap="round" />
    <circle cx="70" cy="245" r="20" fill="#ff8fa3" opacity="0.6" /><circle cx="230" cy="245" r="20" fill="#ff8fa3" opacity="0.6" />
  </g>

  <!-- face two -->
  <g transform="translate(470 250)">
    <circle cx="150" cy="190" r="150" fill="#f3c9a0" stroke="#3a2418" stroke-width="10" />
    <path d="M0 200 Q20 20 150 30 Q280 20 300 200 Q300 90 150 90 Q0 90 0 200Z" fill="#c1440e" />
    <circle cx="105" cy="205" r="14" fill="#3a2418" /><circle cx="195" cy="205" r="14" fill="#3a2418" />
    <path d="M100 258 Q150 305 200 258" fill="none" stroke="#3a2418" stroke-width="10" stroke-linecap="round" />
    <circle cx="70" cy="248" r="20" fill="#ff8fa3" opacity="0.6" /><circle cx="230" cy="248" r="20" fill="#ff8fa3" opacity="0.6" />
  </g>

  <!-- heart between them -->
  <path d="M450 190 C450 140 380 130 380 185 C380 225 450 265 450 265 C450 265 520 225 520 185 C520 130 450 140 450 190Z"
        fill="#e63762" stroke="#fff" stroke-width="8" />

  <!-- placeholder label -->
  <text x="450" y="760" text-anchor="middle" font-family="Georgia, serif" font-size="56" fill="#6b3f2a">
    swap in your own picture
  </text>
  <text x="450" y="820" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#6b3f2a" opacity="0.7">
    public/couple.svg → couple.jpg
  </text>
</svg>
